# Fork default: baton mode for single-slot local LLM servers.
# Only one agent (root included) generates at a time; a parent pauses while its child runs.
- insert:
    - id: subagent-concurrency-limit
      name: dsh-subagent-concurrency-limit
      config:
        baton: true
        maxConcurrentSubagents: 4
        subagentToolNames:
          - subagent
